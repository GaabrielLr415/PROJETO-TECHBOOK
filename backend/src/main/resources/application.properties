spring.application.name=techbook

# Configuracao local padrao: XAMPP (MySQL na porta 3306, normalmente root sem senha).
# Para rodar com MAMP, ative o profile "mamp".
spring.datasource.url=jdbc:mysql://localhost:3306/techbook?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America%2FSao_Paulo&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-response=true

# Envio dos codigos de recuperacao de senha pelo Gmail do TECHBOOK.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${TECHBOOK_MAIL_USERNAME:}
spring.mail.password=${TECHBOOK_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
techbook.mail.from=${TECHBOOK_MAIL_FROM:${TECHBOOK_MAIL_USERNAME:}}

# Carrega configuracoes locais sensiveis sem salvar senha no repositorio.
spring.config.import=optional:classpath:application-local.properties
