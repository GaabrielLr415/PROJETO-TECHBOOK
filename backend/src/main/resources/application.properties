spring.application.name=techbook

# Configuracao local padrao: XAMPP (MySQL na porta 3306, normalmente root sem senha).
# Para rodar com MAMP, ative o profile "mamp".
spring.datasource.url=jdbc:mysql://localhost:3306/techbook?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America%2FSao_Paulo&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-response=true
