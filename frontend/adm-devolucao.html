<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHBOOK | Devolução ADM</title>
  
  <link rel="icon" type="image/svg+xml" href="img/Favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/adm.css">
</head>
<body data-page="admin">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-brand"><img src="img/LOGOMARCA.svg" alt="" class="admin-brand-logo"></div>
      <nav class="admin-nav">
        <a href="adm.html">Visão Geral</a>
        <a href="adm-reservas.html">Registrar Emprestimo</a>
        <a class="active" href="adm-devolucao.html">Registrar devolução</a>
        <a href="adm-atrasos.html">Verificar atrasos</a>
        <a href="adm-livros.html">Consultar Livro</a>
        <a href="adm-usuarios.html">Consultar Usuários</a>
        <a href="adm-livros.html#gestao">Gerenciar Livro</a>
      </nav>
      <div class="sidebar-user"><div><strong>Administrador</strong><span>Controle de Acervo</span></div></div>
    </aside>
    <main class="admin-main">
      <section class="admin-screen form-screen" id="devolucoes">
        <div class="screen-topbar">
          <div class="screen-heading"><h2>Registro de Devolução</h2></div>
          <a class="button ghost" href="adm.html">Voltar ao Menu</a>
        </div>
        <form id="returnForm" class="admin-form-grid two-cols">
          <label class="field-block"><span>Cliente</span><input type="text" placeholder="Ex: Nome do cliente" disabled></label>
          <label class="field-block"><span>Id. do administrador</span><input type="number" id="returnAdminId" placeholder="Ex: 1" value="1" required></label>
          <label class="field-block"><span>Livro</span><input type="text" placeholder="Ex: Título do livro" disabled></label>
          <label class="field-block"><span>Id. do empréstimo</span><input type="number" id="returnLoanId" placeholder="Ex: Código do empréstimo" required></label>
          <label class="field-block"><span>Data de Empréstimo</span><input type="text" value="Informada pelo sistema" disabled></label>
          <label class="field-block"><span>Estado do livro</span><select id="returnBookState"><option value="BOM">Livro em bom estado</option><option value="AVARIADO">Livro com avaria</option></select></label>
          <label class="field-block full"><span>Observação da devolução</span><textarea id="returnObservation" placeholder="Ex: Sem avarias ou descreva o problema encontrado"></textarea></label>
          <div class="form-submit-row full center"><button class="button primary large" type="submit">Registrar Devolução</button></div>
        </form>
        <div class="history-panel">
          <h3>Histórico de devoluções</h3>
          <div id="returnHistory" class="status-list"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script src="js/adm.js"></script>
</body>
</html>
